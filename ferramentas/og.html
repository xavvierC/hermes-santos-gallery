<!doctype html>
<!-- Molde da imagem de prévia do link (assets/og.jpg, 1200x630).

<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400&family=Newsreader:opsz,wght@6..72,400&display=block">
  <style>
    html, body { margin: 0; background: #000; }
    .cartao { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #000; color: #eeebe4; }
    .obra { position: absolute; right: 118px; top: 36px; height: 560px; }
    .meta { position: absolute; left: 66px; top: 60px; margin: 0; font: 400 22px/1.45 'Hanken Grotesk', sans-serif; color: #aaa69d; }
    .nome { position: absolute; left: 60px; bottom: 64px; margin: 0; font: 400 150px/.84 Newsreader, serif; letter-spacing: -.035em; }
    .nome span { display: block; }
    .nome span + span { padding-left: .95em; }
  </style>
</head>
<body>
  <div class="cartao">
    <img class="obra" src="../assets/obras/whale-1-g.webp" alt="">
    <p class="meta">Escultor e artista visual<br>São Paulo, Brasil</p>

  </div>
</body>
</html>
